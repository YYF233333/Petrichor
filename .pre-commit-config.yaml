exclude: ^(thirdparty/|docs/surveys/[^/]+/)
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.7
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|inc)$
        types_or: [text]

  - repo: local
    hooks:
      - id: doc-pairs
        name: doc-pairs
        language: python
        entry: python tools/check_doc_pairs.py
        pass_filenames: false
        files: \.md$

      - id: doc-style
        name: doc-style
        language: python
        entry: python tools/check_doc_style.py
        files: \.md$

      - id: diagnostic-text
        name: diagnostic text
        language: python
        entry: python tools/check_diagnostics.py
        files: ^src/.*\.(cpp|h)$

      - id: commit-msg
        name: commit message
        language: python
        entry: python tools/check_commit_msg.py
        stages: [commit-msg]

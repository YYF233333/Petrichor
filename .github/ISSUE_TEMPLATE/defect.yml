name: Bug report
description: Report a crash, a mismatch with the spec, or an editor, LSP, or CLI bug.
body:
  - type: textarea
    id: script
    attributes:
      label: Reproduction
      description: For language or runtime bugs, share the smallest `.pet` script (and scene, if needed). For editor, LSP, or CLI issues, list the steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Paste the output, diagnostic, or error message as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Describe the expected behavior, and mention the relevant spec section if you know it.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Petrichor version, Godot version, and operating system.
      placeholder: Petrichor 0.2.1, Godot 4.7.2-stable, Windows 11
    validations:
      required: true

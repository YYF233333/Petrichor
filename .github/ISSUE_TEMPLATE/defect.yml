name: Defect
description: A script that behaves differently from what the spec says, or a crash.
body:
  - type: textarea
    id: script
    attributes:
      label: Script
      description: The smallest `.pet` script that shows it, and the scene if one is needed.
      render: gdscript
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happens
      description: The output or the diagnostic, copied as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Name the spec section when you know it.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Petrichor, Godot and the operating system.
      placeholder: Petrichor 0.1, Godot 4.7.2-stable, Windows 11
    validations:
      required: true
